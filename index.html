<head>

<link rel="stylesheet" href="style.css?v=43">
</head>
<body>

<!-- ================= GİRİŞ EKRANI ================= -->
<div id="girisEkrani">
  <div class="giris-kart">
    <div class="giris-logo" id="girisLogo">
      <span class="yer-tutucu">GV</span>
    </div>
    <h1 id="girisBaslik">Green Village Pilates</h1>
    <div class="alt" id="girisAlt">Ön Muhasebe · Pilates Stüdyosu</div>
    <div id="girisGovde"><!-- app.js dolduracak (buton veya kullanıcı/şifre) --></div>
  </div>
</div>

<!-- ================= UYGULAMA ================= -->
<div class="uygulama gizli" id="uygulama">
  <div class="menu-perde" id="menuPerde"></div>

  <!-- Kenar menü -->
  <aside class="kenar" id="kenar">
    <div class="kenar-logo">
      <div class="kutu" id="menuLogo">GV</div>
      <div class="ad"><span id="menuFirmaAdMetin">Green Village Pilates</span><small>Ön Muhasebe</small></div>
    </div>
    <nav class="kenar-menu" id="anaMenu"><!-- app.js dolduracak --></nav>
  </aside>

  <!-- Ana alan -->
  <main class="ana">
    <header class="ust-cubuk">
      <button class="menu-ac" id="menuAcBtn">☰</button>
      <div class="ust-firma" id="ustFirma">
        <div class="lg" id="ustFirmaLogo">GV</div>
        <div class="ad"><span id="ustFirmaAd">Green Village Pilates</span><small>Ön Muhasebe</small></div>
      </div>
      <h2 id="sayfaBaslik">Gösterge Paneli</h2>
      <button class="arac-btn masaustu" id="yedekBtn" title="Yedekle / Geri Yükle">💾</button>
      <button class="arac-btn masaustu" id="temaBtn" title="Tema değiştir">🌙</button>
      <div class="kullanici" id="kullaniciBlok" role="button" tabindex="0">
        <div class="k-isim">
          <div id="kullaniciAd" style="font-weight:600">—</div>
          <div class="soluk" id="kullaniciRol" style="font-size:11.5px">—</div>
        </div>
        <div class="rozet" id="kullaniciRozet">?</div>
      </div>
      <button class="arac-btn masaustu" id="cikisBtn" title="Çıkış" style="margin-left:6px">⏻</button>
      <div class="kul-menu gizli" id="kulMenu">
        <button type="button" id="kmYedek">💾 <span>Yedekle / Geri Yükle</span></button>
        <button type="button" id="kmTema">🌙 <span>Tema değiştir</span></button>
        <div class="ay"></div>
        <button type="button" id="kmCikis" class="cik">⏻ <span>Çıkış Yap</span></button>
      </div>
    </header>
    <div class="icerik" id="icerik">
      <div class="yukleniyor"><div class="spinner"></div>Yükleniyor…</div>
    </div>
  </main>

  <!-- Mobil alt menü (logolu sekme çubuğu) -->
  <nav class="alt-menu" id="altMenu"></nav>
  <!-- Grup sekmesi alt listesi (sheet) -->
  <div class="sheet-perde" id="sheetPerde"></div>
  <div class="alt-sheet" id="altSheet"></div>
</div>

<div id="bildirimler"></div>
<div id="modalKap"></div>

<!-- Excel (.xlsx) okuma kütüphanesi -->
<script src="xlsx.full.min.js"></script>

<script src="app.js?v=43"></script>
</body>
</html>
